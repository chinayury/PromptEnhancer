name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (web extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[web]"

      - name: CLI smoke (promptforge)
        run: python -m promptforge cli --help

      - name: CLI smoke (forge)
        run: python -m forge --help

      - name: Web smoke (Ubuntu / py3.12)
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        env:
          HOST: 127.0.0.1
          PORT: "8123"
          WEB_ACCESS_PASSWORD: ci-platform-pass
          WEB_ADMIN_PASSWORD: CiAdminPass123
        run: |
          set -euo pipefail
          python -m promptforge.webapp > web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8123/healthz > health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat health.json
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          grep -q '"ok":true' health.json
          grep -q "\"version\":\"$VERSION\"" health.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/login)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/api/admin/users)" = "401"
          kill "$WEB_PID"

      - name: Build wheel + sdist
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          python -m pip install build
          python -m build

      - name: Upload dist
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: dist-ci
          path: dist/*
          retention-days: 1

  docker:
    name: Docker build & health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg PIP_INDEX_URL=https://pypi.org/simple -t promptforge:ci .

      - name: Run container & health check
        run: |
          set -euo pipefail
          docker run -d --name promptforge-ci -p 18085:8000 \
            -e WEB_ACCESS_PASSWORD=ci-platform-pass \
            -e WEB_ADMIN_PASSWORD=CiAdminPass123 \
            promptforge:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18085/healthz; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18085/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18085/login)" = "200"

      - name: Container logs
        if: always()
        run: docker logs promptforge-ci || true
