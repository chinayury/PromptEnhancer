[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptforge"
version = "0.1.8"
description = "提示词工坊 PromptForge —— 本地优先的提示词增强工作台（Web 多用户版 + 桌面单机版）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "智维ITMSKY" }]
keywords = ["prompt", "enhancement", "llm", "prompt-engineering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]

dependencies = [
    # 核心增强引擎仅用标准库；以下为两种形态各自需要的第三方依赖。
    # 桌面版：customtkinter
    # Web 版：flask + waitress（werkzeug / jinja2 为 flask 传递依赖，显式声明下界防解析到旧版）
]

[project.optional-dependencies]
desktop = [
    "customtkinter>=5.2.0",
]
web = [
    "flask>=3.1.3",
    "waitress>=3.0.2",
    "werkzeug>=3.1.9",
    "jinja2>=3.1.6",
]

[project.scripts]
promptforge = "promptforge.__main__:main"
promptforge-web = "promptforge.webapp:main"
forge = "forge.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promptforge = [
    "config/providers.json",
    "web/*.html",
    "web/*.svg",
]
